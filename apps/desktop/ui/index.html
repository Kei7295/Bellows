<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Bellows · 风箱</title>
    <style>
      :root {
        --bg: #0a0d12;
        --panel: #11161e;
        --fg: #eef2f8;
        --muted: #7f8b9c;
        --line: #222c39;
        --ember: #ff8a3d;
        --ember-deep: #c94f18;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(120% 90% at 78% 8%, rgba(255, 138, 61, 0.16) 0%, rgba(10, 13, 18, 0) 52%),
          radial-gradient(80% 70% at 8% 100%, rgba(201, 79, 24, 0.12) 0%, rgba(10, 13, 18, 0) 60%),
          var(--bg);
        color: var(--fg);
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }
      /* faint drafting grid, fades outwards */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(255, 255, 255, 0.028) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255, 255, 255, 0.028) 1px, transparent 1px);
        background-size: 44px 44px;
        mask-image: radial-gradient(70% 70% at 50% 45%, #000 0%, transparent 100%);
        pointer-events: none;
      }
      .shell {
        position: relative;
        height: 100%;
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding: 34px 42px 30px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .brand svg {
        width: 34px;
        height: 34px;
        color: var(--ember);
      }
      .wordmark {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.42em;
        text-transform: uppercase;
      }
      .wordmark small {
        display: block;
        margin-top: 5px;
        font-size: 10px;
        font-weight: 400;
        letter-spacing: 0.3em;
        color: var(--muted);
      }
      .stage {
        display: grid;
        place-items: center;
        align-content: center;
        gap: 26px;
        text-align: center;
      }
      .forge {
        position: relative;
        width: 132px;
        height: 132px;
        display: grid;
        place-items: center;
      }
      .forge::after {
        content: "";
        position: absolute;
        inset: -18%;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 138, 61, 0.3) 0%, rgba(255, 138, 61, 0) 68%);
        animation: breathe 3.2s ease-in-out infinite;
      }
      .forge svg {
        position: relative;
        z-index: 1;
        width: 92px;
        height: 92px;
        color: var(--fg);
        opacity: 0.94;
      }
      .ember-core {
        transform-origin: 50% 62%;
        animation: flicker 2.4s ease-in-out infinite;
      }
      h1 {
        margin: 0;
        font-size: 17px;
        font-weight: 500;
        letter-spacing: 0.12em;
      }
      .hint {
        margin: 8px 0 0;
        font-size: 12px;
        color: var(--muted);
        letter-spacing: 0.06em;
      }
      .progress-block {
        display: grid;
        gap: 12px;
      }
      .track {
        position: relative;
        height: 3px;
        border-radius: 999px;
        background: var(--line);
        overflow: hidden;
      }
      .fill {
        position: absolute;
        inset: 0;
        width: 0%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--ember-deep), var(--ember) 70%, #ffc38a);
        box-shadow: 0 0 14px rgba(255, 138, 61, 0.55);
        transition: width 480ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      .track.indeterminate .fill {
        width: 34%;
        animation: sweep 1.4s ease-in-out infinite;
        transition: none;
      }
      .meta {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        letter-spacing: 0.08em;
        color: var(--muted);
      }
      .meta b {
        color: var(--fg);
        font-weight: 500;
        font-variant-numeric: tabular-nums;
      }
      @keyframes breathe {
        0%,
        100% {
          opacity: 0.55;
          transform: scale(0.94);
        }
        50% {
          opacity: 1;
          transform: scale(1.04);
        }
      }
      @keyframes flicker {
        0%,
        100% {
          opacity: 0.85;
          transform: scaleY(1);
        }
        50% {
          opacity: 1;
          transform: scaleY(1.07);
        }
      }
      @keyframes sweep {
        0% {
          left: -34%;
        }
        100% {
          left: 100%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="brand">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M3 8.2c0-1.1.9-2 2-2h5.2c1.3 0 2.5.5 3.4 1.4l1.3 1.3c.6.6 1.4.9 2.2.9H20"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
          />
          <path
            d="M3 15.8c0 1.1.9 2 2 2h5.2c1.3 0 2.5-.5 3.4-1.4l1.3-1.3c.6-.6 1.4-.9 2.2-.9H20"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
          />
          <path d="M3 12h17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="0.45" />
        </svg>
        <div class="wordmark">
          Bellows
          <small>风 箱</small>
        </div>
      </header>

      <main class="stage">
        <div class="forge">
          <svg viewBox="0 0 96 96" fill="none" aria-hidden="true">
            <path
              d="M14 32c0-4.4 3.6-8 8-8h20c5.2 0 10.2 2.1 13.6 5.8l5.2 5.6c2.4 2.6 5.6 4 9 4H82"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              opacity="0.9"
            />
            <path
              d="M14 64c0 4.4 3.6 8 8 8h20c5.2 0 10.2-2.1 13.6-5.8l5.2-5.6c2.4-2.6 5.6-4 9-4H82"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              opacity="0.9"
            />
            <path d="M14 48h68" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" opacity="0.35" />
            <circle class="ember-core" cx="48" cy="48" r="6.5" fill="#ff8a3d" />
            <circle cx="48" cy="48" r="12" stroke="#ff8a3d" stroke-width="1.2" opacity="0.4" />
          </svg>
        </div>
        <div>
          <h1 id="label">正在唤醒风箱</h1>
          <p class="hint">协议进风，人格出火</p>
        </div>
      </main>

      <footer class="progress-block">
        <div class="track indeterminate" id="track"><div class="fill" id="fill"></div></div>
        <div class="meta">
          <span id="status">内核启动中</span>
          <span><b id="percent">--</b> · v0.0.1 BETA</span>
        </div>
      </footer>
    </div>

    <script>
      (function () {
        var track = document.getElementById('track');
        var fill = document.getElementById('fill');
        var label = document.getElementById('label');
        var status = document.getElementById('status');
        var percent = document.getElementById('percent');

        function apply(payload) {
          if (!payload || typeof payload.progress !== 'number') return;
          track.classList.remove('indeterminate');
          var value = Math.max(0, Math.min(1, payload.progress));
          fill.style.width = (value * 100).toFixed(1) + '%';
          percent.textContent = Math.round(value * 100) + '%';
          if (payload.label) {
            label.textContent = payload.label;
            status.textContent = payload.label;
          }
        }

        var api = window.__TAURI__;
        if (api && api.event && api.event.listen) {
          api.event.listen('boot-progress', function (event) {
            apply(event.payload);
          });
        } else {
          // Browser preview / dev fallback: crawl to 90% so the bar still moves.
          var progress = 0.08;
          var timer = setInterval(function () {
            progress = Math.min(0.9, progress + (0.9 - progress) * 0.06);
            apply({ progress: progress, label: '正在唤醒风箱' });
          }, 220);
          window.addEventListener('beforeunload', function () {
            clearInterval(timer);
          });
        }
      })();
    </script>
  </body>
</html>
