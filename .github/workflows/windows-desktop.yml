name: Windows Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "apps/desktop/**"
      - "apps/core/**"
      - "apps/web/**"
      - "packaging/**"
      - ".github/workflows/windows-desktop.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/core/**"
      - "apps/web/**"
      - "packaging/**"
      - ".github/workflows/windows-desktop.yml"

permissions:
  contents: write

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build NSIS installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Build web bundle
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/core/requirements.txt

      - name: Build Python sidecar
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/core/requirements.txt pyinstaller
          python packaging/build_sidecar.py

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Build Tauri installer
        working-directory: apps/desktop
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: bellows-windows-nsis
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
