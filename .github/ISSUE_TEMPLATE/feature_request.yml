name: 功能建议
description: 提出新能力或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先确认该能力不在 README 的「明确未完成 / 未验证」清单中（如真实 LLM、插件运行时、Tauri 桌面壳属于已知规划，不需要重复提）。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述使用场景与当前阻碍，而不是先给出方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望 Bellows 怎么表现？如有替代方案也请说明。
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 前端界面
        - REST API / 事件流
        - OneBot v11 接入
        - 人格 / 记忆 / 模型
        - 插件系统
        - 部署与运维
        - 其他
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 现在你是如何绕过这个限制的？
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 已搜索现有 Issue 与文档，未发现重复
          required: true
        - label: 愿意参与实现或测试
          required: false
