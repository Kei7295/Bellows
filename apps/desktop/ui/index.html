<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Bellows · 风箱</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0f14;
        --fg: #e8edf5;
        --muted: #8b95a5;
        --ember: #ff8a3d;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 70% 30%, #2a1a10 0%, var(--bg) 55%);
        color: var(--fg);
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      }
      .card {
        text-align: center;
        padding: 48px;
      }
      .spark {
        width: 18px;
        height: 18px;
        margin: 0 auto 28px;
        border-radius: 50%;
        background: var(--ember);
        box-shadow: 0 0 0 0 rgba(255, 138, 61, 0.45);
        animation: pulse 1.6s ease-out infinite;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.04em;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.7;
      }
      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(255, 138, 61, 0.45);
        }
        70% {
          box-shadow: 0 0 0 18px rgba(255, 138, 61, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(255, 138, 61, 0);
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="spark"></div>
      <h1>正在点火…</h1>
      <p>Bellows 内核正在启动，稍后会自动打开工作台。<br />若长时间没有反应，请重新启动应用。</p>
    </main>
  </body>
</html>
