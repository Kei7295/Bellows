[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bellows-core"
version = "0.0.1b1"
description = "Bellows (风箱) local core: instances, OneBot v11, demo pipeline, REST/WS API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[tool.setuptools.packages.find]
include = ["bellows_core*"]
